name: Deploy ANG Cric Dose

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Create Firebase configuration
        run: |
          cat > firebase.json <<'EOF'
          {
            "hosting": {
              "public": ".",
              "ignore": [
                "firebase.json",
                ".firebaserc",
                "**/.*",
                "**/node_modules/**",
                ".github/**",
                "README.txt",
                "SETUP_AUTH.txt"
              ]
            }
          }
          EOF

          cat > .firebaserc <<'EOF'
          {
            "projects": {
              "default": "ang-cric-dose"
            }
          }
          EOF

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANG_CRIC_DOSE }}
          projectId: ang-cric-dose
          channelId: live
